<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10~12차시 · 해커톤: 로봇 출시</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Jua',sans-serif; background-color:#F3F8FF; background-image:radial-gradient(#D6E6FF 2px,transparent 2px); background-size:30px 30px; }
    @media print { .no-print{display:none!important;} body{background:#fff!important;background-image:none!important;} }
  </style>
</head>
<body class="text-gray-800 p-4 md:p-8 pb-16">
  <nav class="max-w-5xl mx-auto mb-6 flex flex-wrap items-center justify-between gap-3 no-print">
    <a href="../" class="inline-flex items-center gap-2 bg-white px-5 py-2.5 rounded-full shadow-md text-blue-600 font-bold hover:bg-blue-50 transition text-lg"><i class="fa-solid fa-arrow-left"></i> 메인으로</a>
    <div class="flex gap-2 flex-wrap">
      <a href="../1-3/" class="px-4 py-2 rounded-full text-sm font-bold bg-yellow-100 text-yellow-700 hover:bg-yellow-200 transition">1~3차시</a>
      <a href="../4-6/" class="px-4 py-2 rounded-full text-sm font-bold bg-blue-100 text-blue-700 hover:bg-blue-200 transition">4~6차시</a>
      <a href="../7-9/" class="px-4 py-2 rounded-full text-sm font-bold bg-green-100 text-green-700 hover:bg-green-200 transition">7~9차시</a>
      <span class="px-4 py-2 rounded-full text-sm font-bold bg-red-500 text-white shadow-md">10~12차시</span>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto bg-white rounded-3xl shadow-md border-b-8 border-red-400 p-6 md:p-8">
    <h1 class="text-3xl md:text-4xl font-bold text-red-600 mb-2">10~12차시 · 해커톤: 로봇 출시</h1>
    <p class="text-gray-600 mb-6">프로토타입 소개, 시연 체크, 발표 회고를 한 페이지에서 정리합니다.</p>

    <div class="space-y-4">
      <div class="bg-red-50 rounded-xl p-4">
        <label class="font-bold text-red-700 block mb-2">팀 소개 한 줄</label>
        <input data-key="team_intro" class="w-full border-2 rounded-xl px-3 py-2" placeholder="우리 팀 로봇의 핵심 가치">
      </div>
      <div class="bg-red-50 rounded-xl p-4">
        <label class="font-bold text-red-700 block mb-2">시연 체크리스트</label>
        <div class="grid md:grid-cols-3 gap-2">
          <input data-key="demo1" class="border-2 rounded-xl px-3 py-2" placeholder="센서 반응">
          <input data-key="demo2" class="border-2 rounded-xl px-3 py-2" placeholder="출력 동작">
          <input data-key="demo3" class="border-2 rounded-xl px-3 py-2" placeholder="안전 확인">
        </div>
      </div>
      <div class="bg-red-50 rounded-xl p-4">
        <label class="font-bold text-red-700 block mb-2">발표 후 회고</label>
        <textarea data-key="retrospective" rows="5" class="w-full border-2 rounded-xl px-3 py-2" placeholder="잘한 점 / 개선할 점 / 다음 버전 계획"></textarea>
      </div>
    </div>

    <div class="mt-6 no-print flex gap-2">
      <button onclick="window.print()" class="px-4 py-2 rounded-full bg-gray-200 font-bold">인쇄</button>
      <button onclick="resetAll()" class="px-4 py-2 rounded-full bg-red-100 text-red-600 font-bold">초기화</button>
    </div>
  </main>

<script>
const PREFIX='session1012_';
function saveAll(){document.querySelectorAll('[data-key]').forEach(el=>localStorage.setItem(PREFIX+el.dataset.key,el.value));}
function loadAll(){document.querySelectorAll('[data-key]').forEach(el=>{const v=localStorage.getItem(PREFIX+el.dataset.key);if(v!==null)el.value=v;});}
function resetAll(){if(!confirm('입력을 초기화할까요?'))return;document.querySelectorAll('[data-key]').forEach(el=>{el.value='';localStorage.removeItem(PREFIX+el.dataset.key);});}
document.addEventListener('DOMContentLoaded',()=>{loadAll();document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('input',saveAll);el.addEventListener('change',saveAll);});});
</script>
</body>
</html>
