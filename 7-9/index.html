<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7~9차시 · 세 번째 의뢰: 감각 통합</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Jua',sans-serif; background-color:#F3F8FF; background-image:radial-gradient(#D6E6FF 2px,transparent 2px); background-size:30px 30px; }
    .panel{display:none}.panel.active{display:block}
    .tab-btn.active{transform:scale(1.05); box-shadow:0 10px 25px rgba(0,0,0,.12)}
    @media print { .no-print { display:none !important; } body{background:#fff!important;background-image:none!important;} }
  </style>
</head>
<body class="text-gray-800 p-4 md:p-8 pb-16">
  <nav class="max-w-5xl mx-auto mb-6 flex flex-wrap items-center justify-between gap-3 no-print">
    <a href="../" class="inline-flex items-center gap-2 bg-white px-5 py-2.5 rounded-full shadow-md text-blue-600 font-bold hover:bg-blue-50 transition text-lg"><i class="fa-solid fa-arrow-left"></i> 메인으로</a>
    <div class="flex gap-2 flex-wrap">
      <a href="../1-3/" class="px-4 py-2 rounded-full text-sm font-bold bg-yellow-100 text-yellow-700 hover:bg-yellow-200 transition">1~3차시</a>
      <a href="../4-6/" class="px-4 py-2 rounded-full text-sm font-bold bg-blue-100 text-blue-700 hover:bg-blue-200 transition">4~6차시</a>
      <span class="px-4 py-2 rounded-full text-sm font-bold bg-green-500 text-white shadow-md">7~9차시</span>
      <a href="../10-12/" class="px-4 py-2 rounded-full text-sm font-bold bg-red-100 text-red-700 hover:bg-red-200 transition">10~12차시</a>
    </div>
  </nav>

  <header class="max-w-5xl mx-auto text-center mb-6">
    <h1 class="text-3xl md:text-4xl font-bold text-green-600">7~9차시 · 세 번째 의뢰: 감각 통합</h1>
    <p class="text-gray-600 mt-2">이미지/소리/거리 정보를 합쳐 로봇의 판단 규칙을 설계해요.</p>
  </header>

  <div class="max-w-5xl mx-auto flex flex-wrap gap-2 justify-center mb-6 no-print">
    <button class="tab-btn active bg-green-500 text-white px-4 py-2 rounded-full font-bold" id="tabBtn1" onclick="showPanel(1)">활동 1</button>
    <button class="tab-btn bg-white text-green-700 px-4 py-2 rounded-full font-bold" id="tabBtn2" onclick="showPanel(2)">활동 2</button>
    <button class="tab-btn bg-white text-green-700 px-4 py-2 rounded-full font-bold" id="tabBtn3" onclick="showPanel(3)">활동 3</button>
    <button onclick="resetAll()" class="bg-red-100 text-red-600 px-4 py-2 rounded-full font-bold">초기화</button>
  </div>

  <main class="max-w-5xl mx-auto space-y-6">
    <section id="panel1" class="panel active bg-white rounded-3xl shadow-md border-b-8 border-green-400 p-6">
      <h2 class="text-2xl text-green-600 font-bold mb-3">활동 1 · 멀티센서 관찰표</h2>
      <div class="grid md:grid-cols-3 gap-3">
        <input data-key="obs_img" class="border-2 rounded-xl px-3 py-2" placeholder="이미지 분류 결과">
        <input data-key="obs_sound" class="border-2 rounded-xl px-3 py-2" placeholder="소리 분류 결과">
        <input data-key="obs_dist" class="border-2 rounded-xl px-3 py-2" placeholder="거리 센서값">
      </div>
      <textarea data-key="obs_note" rows="3" class="mt-3 w-full border-2 rounded-xl px-3 py-2" placeholder="관찰한 점 정리"></textarea>
    </section>

    <section id="panel2" class="panel bg-white rounded-3xl shadow-md border-b-8 border-emerald-400 p-6">
      <h2 class="text-2xl text-emerald-600 font-bold mb-3">활동 2 · 통합 판단 규칙</h2>
      <div class="space-y-2">
        <input data-key="rule1" class="w-full border-2 rounded-xl px-3 py-2" placeholder="규칙 1 (예: 사람이 보이고 소음이 크면 경고)">
        <input data-key="rule2" class="w-full border-2 rounded-xl px-3 py-2" placeholder="규칙 2">
        <input data-key="rule3" class="w-full border-2 rounded-xl px-3 py-2" placeholder="규칙 3">
      </div>
    </section>

    <section id="panel3" class="panel bg-white rounded-3xl shadow-md border-b-8 border-lime-400 p-6">
      <h2 class="text-2xl text-lime-600 font-bold mb-3">활동 3 · 최종 알고리즘</h2>
      <textarea data-key="algo" rows="6" class="w-full border-2 rounded-xl px-3 py-2" placeholder="센서 입력 → 조건 판단 → 출력 동작 흐름을 작성"></textarea>
      <p class="text-sm text-gray-500 mt-2">입력 내용은 자동 저장됩니다.</p>
    </section>
  </main>

<script>
const PREFIX='session79_';
function showPanel(n){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel'+n).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',i===n-1);
    b.classList.toggle('bg-green-500',i===n-1); b.classList.toggle('text-white',i===n-1);
    b.classList.toggle('bg-white',i!==n-1); b.classList.toggle('text-green-700',i!==n-1);
  });
}
function saveAll(){document.querySelectorAll('[data-key]').forEach(el=>localStorage.setItem(PREFIX+el.dataset.key,el.value));}
function loadAll(){document.querySelectorAll('[data-key]').forEach(el=>{const v=localStorage.getItem(PREFIX+el.dataset.key);if(v!==null)el.value=v;});}
function resetAll(){if(!confirm('입력을 초기화할까요?'))return;document.querySelectorAll('[data-key]').forEach(el=>{el.value='';localStorage.removeItem(PREFIX+el.dataset.key);});}
document.addEventListener('DOMContentLoaded',()=>{loadAll();document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('input',saveAll);el.addEventListener('change',saveAll);});});
</script>
</body>
</html>
